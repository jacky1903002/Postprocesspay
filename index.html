<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>後處理論件計酬金額統計系統 - 企業商業版</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (Excel 匯入匯出) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Chart.js (圖表與 PNG 匯出) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js DataLabels Plugin (圖表數值標籤) -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <style>
        body { background-color: #f4f6f9; font-family: "Microsoft JhengHei", Arial, sans-serif; }
        .login-container { max-width: 420px; margin-top: 10vh; }
        .app-container { display: none; }
        .card { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .fw-heavy { font-weight: 700 !important; }
        .dashboard-card { padding: 8px 12px !important; }
        .dashboard-card h6 { font-size: 0.8rem; margin-bottom: 2px; font-weight: 700; color: #495057; }
        .dashboard-card h3 { font-size: 1.25rem; font-weight: 800; }
        .table-fullscreen-container { min-height: 62vh; max-height: 66vh; overflow-y: auto; }
        .editable-cell { cursor: pointer; transition: background-color 0.2s; }
        .editable-cell:hover { background-color: #e9ecef; }
        .inline-input { width: 100%; border: 2px solid #3b82f6; border-radius: 4px; padding: 2px 5px; font-weight: 700; font-size: 0.9rem; background: #fff; }
    </style>
</head>
<body>

    <!-- 1. 登入畫面 (Firebase Auth) -->
    <div id="loginSection" class="container login-container">
        <div class="card shadow-lg p-3">
            <div class="card-body p-4">
                <h3 class="text-center mb-4 text-primary fw-heavy"><i class="fa-solid fa-shield-halved"></i> 系統安全登入</h3>
                <div id="loginError" class="alert alert-danger d-none fw-heavy" role="alert"></div>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label fw-heavy text-dark">電子郵件帳號</label>
                        <input type="email" class="form-control fw-heavy" id="loginEmail" required placeholder="name@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-heavy text-dark">密碼</label>
                        <input type="password" class="form-control fw-heavy" id="loginPassword" required placeholder="密碼">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-heavy shadow-sm">立即登入系統</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 2. 主系統畫面 (企業商業滿版) -->
    <div id="appSection" class="container-fluid px-4 py-3 app-container">
        <!-- 頂部導覽列 / 狀態列 -->
        <div class="row align-items-center mb-3 bg-white p-3 rounded shadow-sm mx-0 border-start border-4 border-primary">
            <div class="col-md-4">
                <h4 class="mb-0 text-primary fw-heavy"><i class="fa-solid fa-chart-line"></i> 後處理論件計酬統計系統</h4>
            </div>
            <div class="col-md-4 text-center">
                <span id="connectionStatus" class="badge bg-success p-2 me-2 fw-heavy">檢查連線中...</span>
                <span id="lastSaveTime" class="text-dark small fw-heavy">上次儲存：無</span>
            </div>
            <div class="col-md-4 text-end">
                <span id="userDisplayEmail" class="me-3 text-dark small fw-heavy"></span>
                <button id="logoutBtn" class="btn btn-outline-danger btn-sm fw-heavy"><i class="fa-solid fa-right-from-bracket"></i> 登出</button>
            </div>
        </div>

        <!-- 頂部功能按鈕與儀表板 -->
        <div class="row g-2 mb-3 align-items-center">
            <!-- 儀表板卡片 (在入金分頁時會自動隱藏) -->
            <div class="col-xl-6 col-lg-7" id="dashboardSection">
                <div class="row g-2">
                    <div class="col-4">
                        <div class="card bg-white text-primary dashboard-card border border-primary">
                            <div class="card-body p-2">
                                <h6 class="card-title text-muted">累積完成產品總數</h6>
                                <h3 id="totalCompletedCount" class="fw-heavy mb-0 text-dark">0</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="card bg-white text-success dashboard-card border border-success">
                            <div class="card-body p-2">
                                <h6 class="card-title text-muted">實際總發放金額</h6>
                                <h3 id="totalActualPrice" class="fw-heavy mb-0 text-success">$0</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="card bg-white text-info dashboard-card border border-info">
                            <div class="card-body p-2">
                                <h6 class="card-title text-muted">預計總金額</h6>
                                <h3 id="totalEstimatedPrice" class="fw-heavy mb-0 text-info">$0</h3>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 右上角功能按鈕群 -->
            <div class="col-xl-6 col-lg-5 text-end ms-auto">
                <div class="d-flex justify-content-end gap-2 flex-wrap">
                    <button class="btn btn-dark btn-sm fw-heavy px-3 shadow-sm" id="openChartsModalBtn">
                        <i class="fa-solid fa-chart-pie"></i> 後處理論件計酬分析
                    </button>
                    <button class="btn btn-success btn-sm fw-heavy px-3 shadow-sm" id="addNewRowBtn" onclick="addNewRow()">
                        <i class="fa-solid fa-plus"></i> 新增一列
                    </button>
                    <label class="btn btn-warning btn-sm fw-heavy px-3 text-dark shadow-sm mb-0" style="cursor: pointer;">
                        <i class="fa-solid fa-file-excel"></i> 匯入 Excel
                        <input type="file" id="excelFileinput" accept=".xlsx, .xls" class="d-none">
                    </label>
                    <button class="btn btn-secondary btn-sm fw-heavy px-3 shadow-sm" id="exportExcelBtn">
                        <i class="fa-solid fa-file-arrow-down"></i> 匯出 Excel
                    </button>
                </div>
            </div>
        </div>

        <!-- 工作表標籤列與分頁管理 (新增/刪除) -->
        <div class="d-flex align-items-center justify-content-between mb-2 flex-wrap gap-2">
            <ul class="nav nav-tabs fw-heavy mb-0" id="sheetTabs" style="border-bottom: none;">
                <!-- 動態產生 -->
            </ul>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-primary btn-sm fw-heavy shadow-sm" onclick="addNewSheetPrompt()">
                    <i class="fa-solid fa-plus"></i> 新增分頁
                </button>
                <div id="sheetDeleteContainer">
                    <!-- 動態刪除目前分頁按鈕 -->
                </div>
            </div>
        </div>

        <!-- 全螢幕滿版資料表格區域 (附帶右下角簽收欄位) -->
        <div class="card shadow-sm border-0 mb-4 w-100 bg-white">
            <div class="card-body p-3">
                <div class="table-responsive table-fullscreen-container mb-2">
                    <table class="table table-hover table-bordered align-middle mb-0" id="dynamicTable">
                        <thead class="table-dark sticky-top" id="tableHeader" style="font-size: 0.95rem;">
                            <!-- 動態表頭 -->
                        </thead>
                        <tbody id="workTableBody" class="fw-heavy" style="font-size: 0.95rem;">
                            <!-- 動態內容 -->
                        </tbody>
                    </table>
                </div>
                <!-- 右下角簽收欄位 -->
                <div class="d-flex justify-content-end align-items-center pt-2 border-top">
                    <div class="fw-heavy text-dark fs-6 pe-3">
                        簽收人：<span style="display: inline-block; border-bottom: 2px solid #333; width: 180px; text-align: center;">&nbsp;</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. 6張分析圖表標準大視窗 Modal (橫3縱2排列) -->
    <div class="modal fade" id="chartsModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-scrollable" style="max-width: 95vw;">
            <div class="modal-content shadow-lg">
                <div class="modal-header bg-dark text-white py-2">
                    <h5 class="modal-title fw-heavy"><i class="fa-solid fa-chart-column"></i> 後處理論件計酬 - 6 張商業分析圖表</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body bg-light p-3">
                    <div class="row g-3">
                        <div class="col-lg-4 col-md-6">
                            <div class="card shadow h-100">
                                <div class="card-header bg-white d-flex justify-content-between align-items-center py-1">
                                    <h6 class="mb-0 fw-heavy text-dark" style="font-size: 0.9rem;">1. 累積完成品號數量</h6>
                                    <button class="btn btn-xs btn-outline-primary py-0 px-2 fw-heavy" onclick="exportChartAsPNG('chart1', '累積完成品號數量.png')"><i class="fa-solid fa-download"></i></button>
                                </div>
                                <div class="card-body p-2"><canvas id="chart1" height="210"></canvas></div>
                            </div>
                        </div>
                        <div class="col-lg-4 col-md-6">
                            <div class="card shadow h-100">
                                <div class="card-header bg-white d-flex justify-content-between align-items-center py-1">
                                    <h6 class="mb-0 fw-heavy text-dark" style="font-size: 0.9rem;">2. 累計實際發放金額</h6>
                                    <button class="btn btn-xs btn-outline-primary py-0 px-2 fw-heavy" onclick="exportChartAsPNG('chart2', '累計實際發放金額.png')"><i class="fa-solid fa-download"></i></button>
                                </div>
                                <div class="card-body p-2"><canvas id="chart2" height="210"></canvas></div>
                            </div>
                        </div>
                        <div class="col-lg-4 col-md-6">
                            <div class="card shadow h-100">
                                <div class="card-header bg-white d-flex justify-content-between align-items-center py-1">
                                    <h6 class="mb-0 fw-heavy text-dark" style="font-size: 0.9rem;">3. 作業人員累積發放金額</h6>
                                    <button class="btn btn-xs btn-outline-primary py-0 px-2 fw-heavy" onclick="exportChartAsPNG('chart3', '作業人員累積發放金額.png')"><i class="fa-solid fa-download"></i></button>
                                </div>
                                <div class="card-body p-2"><canvas id="chart3" height="210"></canvas></div>
                            </div>
                        </div>
                        <div class="col-lg-4 col-md-6">
                            <div class="card shadow h-100">
                                <div class="card-header bg-white d-flex justify-content-between align-items-center py-1">
                                    <h6 class="mb-0 fw-heavy text-dark" style="font-size: 0.9rem;">4. 累積實際發放金額</h6>
                                    <button class="btn btn-xs btn-outline-primary py-0 px-2 fw-heavy" onclick="exportChartAsPNG('chart4', '累積實際發放金額.png')"><i class="fa-solid fa-download"></i></button>
                                </div>
                                <div class="card-body p-2"><canvas id="chart4" height="210"></canvas></div>
                            </div>
                        </div>
                        <div class="col-lg-4 col-md-6">
                            <div class="card shadow h-100">
                                <div class="card-header bg-white d-flex justify-content-between align-items-center py-1">
                                    <h6 class="mb-0 fw-heavy text-dark" style="font-size: 0.9rem;">5. 各週完成率統計</h6>
                                    <button class="btn btn-xs btn-outline-primary py-0 px-2 fw-heavy" onclick="exportChartAsPNG('chart5', '各週完成率統計.png')"><i class="fa-solid fa-download"></i></button>
                                </div>
                                <div class="card-body p-2"><canvas id="chart5" height="210"></canvas></div>
                            </div>
                        </div>
                        <div class="col-lg-4 col-md-6">
                            <div class="card shadow h-100">
                                <div class="card-header bg-white d-flex justify-content-between align-items-center py-1">
                                    <h6 class="mb-0 fw-heavy text-dark" style="font-size: 0.9rem;">6. 累計工時 (工時×實際完成數)</h6>
                                    <button class="btn btn-xs btn-outline-primary py-0 px-2 fw-heavy" onclick="exportChartAsPNG('chart6', '累計工時統計.png')"><i class="fa-solid fa-download"></i></button>
                                </div>
                                <div class="card-body p-2"><canvas id="chart6" height="210"></canvas></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-white justify-content-between py-2">
                    <button class="btn btn-dark fw-heavy px-4" id="exportAllChartsBtn">
                        <i class="fa-solid fa-file-image"></i> 一鍵匯出所有 6 張圖表 (PNG)
                    </button>
                    <button type="button" class="btn btn-secondary fw-heavy px-4" data-bs-dismiss="modal">關閉視窗</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase SDK 10 Modular 與商業邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB5-fDWurERD8zScyENywKa3Sh5pTAPj6k",
            authDomain: "postprocesspa.firebaseapp.com",
            projectId: "postprocesspa",
            storageBucket: "postprocesspa.firebasestorage.app",
            messagingSenderId: "761514477508",
            appId: "1:761514477508:web:5ff9dccc6ed7b1de7d4691",
            measurementId: "G-GNK44CTS8K"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const loginSection = document.getElementById("loginSection");
        const appSection = document.getElementById("appSection");
        const loginForm = document.getElementById("loginForm");
        const loginError = document.getElementById("loginError");
        const logoutBtn = document.getElementById("logoutBtn");
        const userDisplayEmail = document.getElementById("userDisplayEmail");
        const connectionStatus = document.getElementById("connectionStatus");
        const lastSaveTimeEl = document.getElementById("lastSaveTime");

        let currentSheet = "W1";
        let allDataCache = {};
        let depositsCache = {};
        let chartInstances = {};
        let chartsModalObj = null;

        document.addEventListener("DOMContentLoaded", () => {
            chartsModalObj = new bootstrap.Modal(document.getElementById('chartsModal'));
        });

        document.getElementById('openChartsModalBtn').addEventListener('click', () => {
            if (chartsModalObj) {
                chartsModalObj.show();
                renderAllCharts();
            }
        });

        onValue(ref(db, ".info/connected"), (snap) => {
            if (snap.val() === true) {
                connectionStatus.textContent = "已連線 Realtime DB";
                connectionStatus.className = "badge bg-success p-2 me-2 fw-heavy";
            } else {
                connectionStatus.textContent = "連線中斷...";
                connectionStatus.className = "badge bg-danger p-2 me-2 fw-heavy";
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.style.display = "none";
                appSection.style.display = "block";
                userDisplayEmail.textContent = user.email;
                initRealtimeSync();
            } else {
                loginSection.style.display = "block";
                appSection.style.display = "none";
            }
        });

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            loginError.classList.add("d-none");
            try {
                await signInWithEmailAndPassword(auth, document.getElementById("loginEmail").value, document.getElementById("loginPassword").value);
            } catch (error) {
                loginError.textContent = "登入失敗：" + error.message;
                loginError.classList.remove("d-none");
            }
        });

        logoutBtn.addEventListener("click", () => signOut(auth));

        function initRealtimeSync() {
            onValue(ref(db, "sheets"), (snapshot) => {
                if (snapshot.exists()) {
                    allDataCache = snapshot.val();
                } else {
                    allDataCache = {
                        "W1": {
                            "row1": {
                                "品號": "10407－VALE000", "貨號": "FVSE－1535", "工單號碼": "ML10－260828004",
                                "數量": 70, "後處理工時(H)": 0.75, "單價": 187, "作業人員": "丁世宣",
                                "預計總價": 13090, "實際完成數": 65, "實際總價": 12155, "完成率": 0.928571, "備註": ""
                            }
                        }
                    };
                    set(ref(db, "sheets"), allDataCache);
                }
                updateLastSaveTime();
                renderApp();
            });

            onValue(ref(db, "deposits"), (snapshot) => {
                if (snapshot.exists()) {
                    depositsCache = snapshot.val();
                } else {
                    depositsCache = {
                        "dep1": { "日期": "9月21日", "入金金額": 200000 },
                        "dep2": { "日期": "10月7日", "入金金額": 200000 }
                    };
                    set(ref(db, "deposits"), depositsCache);
                }
                renderApp();
            });
        }

        function updateLastSaveTime() {
            lastSaveTimeEl.textContent = "上次儲存：" + new Date().toLocaleString();
        }

        window.renderApp = function() {
            renderTabs();
            renderTable();
            updateDashboard();
        }

        function renderTabs() {
            const sheetTabs = document.getElementById("sheetTabs");
            const deleteContainer = document.getElementById("sheetDeleteContainer");
            sheetTabs.innerHTML = "";
            deleteContainer.innerHTML = "";
            
            Object.keys(allDataCache).forEach(name => {
                const li = document.createElement("li");
                li.className = "nav-item me-1";
                li.innerHTML = `<button class="nav-link fw-heavy rounded ${name === currentSheet ? 'active bg-primary text-white' : 'bg-light text-dark border'}" onclick="switchSheet('${name}')">${name}</button>`;
                sheetTabs.appendChild(li);
            });

            const depositLi = document.createElement("li");
            depositLi.className = "nav-item ms-2";
            depositLi.innerHTML = `<button class="nav-link fw-heavy rounded ${currentSheet === 'DEPOSITS_PAGE' ? 'active bg-warning text-dark' : 'bg-light text-dark border'}" onclick="switchSheet('DEPOSITS_PAGE')"><i class="fa-solid fa-wallet"></i> 入金與剩餘金額管理</button>`;
            sheetTabs.appendChild(depositLi);

            if (currentSheet !== "DEPOSITS_PAGE") {
                const sheetNames = Object.keys(allDataCache);
                if (sheetNames.length > 1) {
                    deleteContainer.innerHTML = `
                        <button class="btn btn-outline-danger btn-sm fw-heavy shadow-sm" onclick="deleteCurrentSheet()">
                            <i class="fa-solid fa-trash-can"></i> 刪除分頁 (${currentSheet})
                        </button>
                    `;
                }
            }
        }

        window.switchSheet = function(name) {
            currentSheet = name;
            renderApp();
        }

        window.addNewSheetPrompt = function() {
            const name = prompt("請輸入新工作表名稱 (例如: W2):");
            if (name && !allDataCache[name] && name !== "DEPOSITS_PAGE") {
                allDataCache[name] = {};
                set(ref(db, "sheets"), allDataCache).then(() => {
                    currentSheet = name;
                    renderApp();
                });
            } else if (name) {
                alert("此分頁名稱已存在或不合法！");
            }
        }

        window.deleteCurrentSheet = function() {
            const sheetNames = Object.keys(allDataCache);
            if (sheetNames.length <= 1) {
                alert("至少需要保留一個工作表，無法刪除！");
                return;
            }
            if (confirm(`確定要刪除工作表「${currentSheet}」以及其所有記錄嗎？`)) {
                delete allDataCache[currentSheet];
                set(ref(db, "sheets"), allDataCache).then(() => {
                    currentSheet = Object.keys(allDataCache)[0];
                    renderApp();
                });
            }
        }

        window.addNewRow = function() {
            if (currentSheet === "DEPOSITS_PAGE") {
                const newDepKey = 'dep_' + Date.now();
                depositsCache[newDepKey] = { "日期": "新日期", "入金金額": 0 };
                set(ref(db, "deposits"), depositsCache).then(() => renderApp());
            } else {
                const newRowKey = 'row_' + Date.now();
                if (!allDataCache[currentSheet]) allDataCache[currentSheet] = {};
                allDataCache[currentSheet][newRowKey] = {
                    "品號": "新品號", "貨號": "新貨號", "工單號碼": "新工單",
                    "數量": 0, "後處理工時(H)": 0, "單價": 0, "作業人員": "未指派",
                    "預計總價": 0, "實際完成數": 0, "實際總價": 0, "完成率": 0, "備註": ""
                };
                set(ref(db, "sheets"), allDataCache).then(() => renderApp());
            }
        }

        window.deleteRowItem = function(key) {
            if (confirm("確定刪除此列記錄？")) {
                if (currentSheet === "DEPOSITS_PAGE") {
                    delete depositsCache[key];
                    set(ref(db, "deposits"), depositsCache).then(() => renderApp());
                } else {
                    delete allDataCache[currentSheet][key];
                    set(ref(db, "sheets"), allDataCache).then(() => renderApp());
                }
            }
        }

        window.makeEditable = function(tdElement, key, field, type = "text") {
            if (tdElement.querySelector("input")) return;
            const currentVal = tdElement.innerText.replace('$', '').replace('%', '').trim();
            tdElement.innerHTML = `<input type="${type}" class="inline-input" value="${currentVal === '-' ? '' : currentVal}" autofocus>`;
            const input = tdElement.querySelector("input");
            
            const save = () => {
                let newVal = input.value;
                updateCellData(key, field, newVal);
            };

            input.addEventListener("blur", save);
            input.addEventListener("keydown", (e) => {
                if (e.key === "Enter") save();
            });
        }

        window.updateCellData = function(key, field, value) {
            if (currentSheet === "DEPOSITS_PAGE") {
                if (field === '入金金額') {
                    depositsCache[key][field] = Number(value) || 0;
                } else {
                    depositsCache[key][field] = value;
                }
                set(ref(db, "deposits"), depositsCache);
                renderApp();
            } else {
                let row = allDataCache[currentSheet][key];
                if (field === '數量' || field === '實際完成數') {
                    row[field] = parseInt(value) || 0;
                } else if (field === '後處理工時(H)') {
                    row[field] = parseFloat(value) || 0;
                    row['單價'] = Math.floor(250 * row[field]);
                } else {
                    row[field] = value;
                }

                const qty = Number(row['數量'] || 0);
                const unitPrice = Number(row['單價'] || 0);
                const actualComp = Number(row['實際完成數'] || 0);

                row['預計總價'] = qty * unitPrice;
                row['實際總價'] = unitPrice * actualComp;
                row['完成率'] = qty > 0 ? (actualComp / qty) : 0;

                set(ref(db, `sheets/${currentSheet}/${key}`), row).then(() => {
                    renderTable();
                    updateDashboard();
                });
            }
        }

        function renderTable() {
            const thead = document.getElementById("tableHeader");
            const tbody = document.getElementById("workTableBody");
            tbody.innerHTML = "";

            if (currentSheet === "DEPOSITS_PAGE") {
                thead.innerHTML = `
                    <tr>
                        <th class="fw-heavy">日期</th>
                        <th class="fw-heavy">入金金額 (NT$)</th>
                        <th class="fw-heavy" style="width: 100px;">操作</th>
                    </tr>
                `;
                
                let totalDeposit = 0;
                let totalActualDispatched = 0;

                Object.values(allDataCache).forEach(sheet => {
                    Object.values(sheet).forEach(row => {
                        totalActualDispatched += Number(row.實際總價 || 0);
                    });
                });

                const depKeys = Object.keys(depositsCache);
                depKeys.forEach(key => {
                    const d = depositsCache[key];
                    totalDeposit += Number(d.入金金額 || 0);
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td class="editable-cell" ondblclick="makeEditable(this, '${key}', '日期')">${d.日期 || ''}</td>
                        <td class="editable-cell text-success" ondblclick="makeEditable(this, '${key}', '入金金額', 'number')">$${Number(d.入金金額 || 0).toLocaleString()}</td>
                        <td><button class="btn btn-sm btn-outline-danger fw-heavy py-0" onclick="deleteRowItem('${key}')"><i class="fa-solid fa-trash"></i> 刪除</button></td>
                    `;
                    tbody.appendChild(tr);
                });

                const remainingAmount = totalDeposit - totalActualDispatched;

                const summaryTr = document.createElement("tr");
                summaryTr.className = "table-warning fw-heavy";
                summaryTr.innerHTML = `
                    <td class="fw-heavy">累積入金總額：$${totalDeposit.toLocaleString()}</td>
                    <td class="fw-heavy">實際總發放累計：$${totalActualDispatched.toLocaleString()}</td>
                    <td class="fw-heavy ${remainingAmount >= 0 ? 'text-success' : 'text-danger'}">剩餘金額：$${remainingAmount.toLocaleString()}</td>
                `;
                tbody.appendChild(summaryTr);

            } else {
                thead.innerHTML = `
                    <tr>
                        <th class="fw-heavy">品號</th>
                        <th class="fw-heavy">貨號</th>
                        <th class="fw-heavy">工單號碼</th>
                        <th class="fw-heavy">數量</th>
                        <th class="fw-heavy">後處理工時(H)</th>
                        <th class="fw-heavy bg-light text-secondary">單價 (公式)</th>
                        <th class="fw-heavy">作業人員</th>
                        <th class="fw-heavy bg-light text-secondary">預計總價 (公式)</th>
                        <th class="fw-heavy">實際完成數</th>
                        <th class="fw-heavy bg-light text-secondary">實際總價 (公式)</th>
                        <th class="fw-heavy bg-light text-secondary">完成率 (公式)</th>
                        <th class="fw-heavy">備註</th>
                        <th class="fw-heavy" style="width: 100px;">操作</th>
                    </tr>
                `;

                const sheetData = allDataCache[currentSheet] || {};
                const keys = Object.keys(sheetData);

                if (keys.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="13" class="text-center text-muted py-4 fw-heavy">此工作表目前無記錄，請點擊上方「新增一列」按鈕</td></tr>`;
                    return;
                }

                keys.forEach(key => {
                    const row = sheetData[key];
                    const ratePercent = ((row.完成率 || 0) * 100).toFixed(1) + "%";
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td class="editable-cell" ondblclick="makeEditable(this, '${key}', '品號')">${row.品號 || ''}</td>
                        <td class="editable-cell" ondblclick="makeEditable(this, '${key}', '貨號')">${row.貨號 || ''}</td>
                        <td class="editable-cell" ondblclick="makeEditable(this, '${key}', '工單號碼')">${row.工單號碼 || ''}</td>
                        <td class="editable-cell" ondblclick="makeEditable(this, '${key}', '數量', 'number')">${row.數量 || 0}</td>
                        <td class="editable-cell" ondblclick="makeEditable(this, '${key}', '後處理工時(H)', 'number')">${row["後處理工時(H)"] || 0}</td>
                        <td class="bg-light fw-bold text-primary">$${row.單價 || 0}</td>
                        <td class="editable-cell" ondblclick="makeEditable(this, '${key}', '作業人員')">${row.作業人員 || ''}</td>
                        <td class="bg-light fw-bold">$${row.預計總價 || 0}</td>
                        <td class="editable-cell" ondblclick="makeEditable(this, '${key}', '實際完成數', 'number')">${row.實際完成數 || 0}</td>
                        <td class="bg-light fw-bold text-success">$${row.實際總價 || 0}</td>
                        <td class="bg-light"><span class="badge bg-info text-dark fw-heavy">${ratePercent}</span></td>
                        <td class="editable-cell" ondblclick="makeEditable(this, '${key}', '備註')">${row.備註 || ''}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-danger fw-heavy py-0 px-2" onclick="deleteRowItem('${key}')"><i class="fa-solid fa-trash"></i> 刪除</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        function updateDashboard() {
            const dashboardSection = document.getElementById("dashboardSection");
            if (currentSheet === "DEPOSITS_PAGE") {
                dashboardSection.style.display = "none";
                return;
            } else {
                dashboardSection.style.display = "block";
            }

            const sheetData = allDataCache[currentSheet] || {};
            let totalCompleted = 0, totalActual = 0, totalEstimated = 0;

            Object.values(sheetData).forEach(row => {
                totalCompleted += Number(row.實際完成數 || 0);
                totalActual += Number(row.實際總價 || 0);
                totalEstimated += Number(row.預計總價 || 0);
            });

            document.getElementById("totalCompletedCount").textContent = totalCompleted.toLocaleString();
            document.getElementById("totalActualPrice").textContent = "$" + totalActual.toLocaleString();
            document.getElementById("totalEstimatedPrice").textContent = "$" + totalEstimated.toLocaleString();
        }

        function sortObjDescending(obj) {
            const sortedEntries = Object.entries(obj).sort((a, b) => b[1] - a[1]);
            const sortedKeys = sortedEntries.map(item => item[0]);
            const sortedValues = sortedEntries.map(item => item[1]);
            return { keys: sortedKeys, values: sortedValues };
        }

        function renderAllCharts() {
            let allRows = [];
            Object.values(allDataCache).forEach(s => allRows.push(...Object.values(s)));

            const itemCounts = {};
            allRows.forEach(r => {
                const item = r.品號 || "未知品號";
                itemCounts[item] = (itemCounts[item] || 0) + Number(r.實際完成數 || 0);
            });
            const sortedItemCounts = sortObjDescending(itemCounts);
            createOrUpdateChart('chart1', 'bar', sortedItemCounts.keys, sortedItemCounts.values, '完成數量');

            const itemPrices = {};
            allRows.forEach(r => {
                const item = r.品號 || "未知品號";
                itemPrices[item] = (itemPrices[item] || 0) + Number(r.實際總價 || 0);
            });
            const sortedItemPrices = sortObjDescending(itemPrices);
            createOrUpdateChart('chart2', 'bar', sortedItemPrices.keys, sortedItemPrices.values, '金額 (NT$)');

            const opPrices = {};
            allRows.forEach(r => {
                const op = r.作業人員 || "未指派";
                opPrices[op] = (opPrices[op] || 0) + Number(r.實際總價 || 0);
            });
            createOrUpdateChart('chart3', 'doughnut', Object.keys(opPrices), Object.values(opPrices), '發放金額', null, {
                plugins: {
                    datalabels: {
                        color: '#000',
                        font: { weight: 'bold', size: 11 },
                        formatter: (value) => '$' + value.toLocaleString()
                    }
                }
            }, [ChartDataLabels]);

            const sheetNames = Object.keys(allDataCache);
            let cumulativeSum = 0;
            const sheetCumulativeTotals = sheetNames.map(name => {
                let sum = 0;
                Object.values(allDataCache[name]).forEach(r => sum += Number(r.實際總價 || 0));
                cumulativeSum += sum;
                return cumulativeSum;
            });
            createOrUpdateChart('chart4', 'line', sheetNames, sheetCumulativeTotals, '累積實際發放金額 (NT$)');

            const sheetRates = sheetNames.map(name => {
                let totalQ = 0, totalA = 0;
                Object.values(allDataCache[name]).forEach(r => {
                    totalQ += Number(r.數量 || 0);
                    totalA += Number(r.實際完成數 || 0);
                });
                return totalQ > 0 ? Number(((totalA / totalQ) * 100).toFixed(1)) : 0;
            });
            createOrUpdateChart('chart5', 'line', sheetNames, sheetRates, '平均完成率 (%)', 100);

            const opHours = {};
            allRows.forEach(r => {
                const op = r.作業人員 || "未指派";
                const h = Number(r["後處理工時(H)"] || 0);
                const act = Number(r["實際完成數"] || 0);
                opHours[op] = (opHours[op] || 0) + (h * act);
            });
            const sortedOpHours = sortObjDescending(opHours);
            createOrUpdateChart('chart6', 'bar', sortedOpHours.keys, sortedOpHours.values, '累計總工時 (H)');
        }

        function createOrUpdateChart(canvasId, type, labels, data, labelName, maxY = null, customOptions = {}, pluginsList = []) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            if (chartInstances[canvasId]) chartInstances[canvasId].destroy();

            const baseOptions = {
                responsive: true,
                maintainAspectRatio: false,
                scales: type !== 'doughnut' ? { y: { beginAtZero: true, ...(maxY ? { max: maxY } : {}) } } : {},
                ...customOptions
            };

            chartInstances[canvasId] = new Chart(ctx, {
                type: type,
                data: {
                    labels: labels,
                    datasets: [{
                        label: labelName,
                        data: data,
                        borderColor: '#3b82f6',
                        backgroundColor: type === 'line' ? 'rgba(59, 130, 246, 0.2)' : ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4'],
                        fill: type === 'line',
                        tension: type === 'line' ? 0.1 : 0,
                        borderWidth: 2
                    }]
                },
                options: baseOptions,
                plugins: pluginsList
            });
        }

        window.exportChartAsPNG = function(canvasId, filename) {
            const link = document.createElement('a');
            link.href = document.getElementById(canvasId).toDataURL('image/png');
            link.download = filename;
            link.click();
        }

        document.getElementById('exportAllChartsBtn').addEventListener('click', () => {
            const chartIds = ['chart1', 'chart2', 'chart3', 'chart4', 'chart5', 'chart6'];
            chartIds.forEach((id, idx) => {
                const canvas = document.getElementById(id);
                if (canvas) {
                    if (chartInstances[id]) {
                        chartInstances[id].update();
                    }
                    setTimeout(() => {
                        const link = document.createElement('a');
                        link.href = canvas.toDataURL('image/png');
                        const titles = [
                            '1_累積完成品號數量.png',
                            '2_累計實際發放金額.png',
                            '3_作業人員累積發放金額.png',
                            '4_累積實際發放金額.png',
                            '5_各週完成率統計.png',
                            '6_累計工時統計.png'
                        ];
                        link.download = titles[idx];
                        link.click();
                    }, idx * 400);
                }
            });
        });

        document.getElementById('exportExcelBtn').addEventListener('click', () => {
            const wb = XLSX.utils.book_new();
            Object.keys(allDataCache).forEach(sheetName => {
                const dataArray = Object.values(allDataCache[sheetName]).map(r => ({
                    "品號": r.品號, "貨號": r.貨號, "工單號碼": r.工單號碼, "數量": r.數量,
                    "後處理工時(H)": r["後處理工時(H)"], "單價": r.單價, "作業人員": r.作業人員,
                    "預計總價": r.預計總價, "實際完成數": r.實際完成數, "實際總價": r.實際總價,
                    "完成率": r.完成率, "備註": r.備註 || ""
                }));
                dataArray.push({});
                dataArray.push({ "品號": "簽收人：___________________" });
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dataArray), sheetName);
            });
            const depArray = Object.values(depositsCache).map(d => ({ "日期": d.日期, "入金金額": d.入金金額 }));
            depArray.push({});
            depArray.push({ "日期": "簽收人：___________________" });
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(depArray), "入金記錄");
            XLSX.writeFile(wb, "後處理論件計酬完整統計報表.xlsx");
        });

        document.getElementById('excelFileinput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                workbook.SheetNames.forEach(sheetName => {
                    if (sheetName === "入金記錄") {
                        const jsonRows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
                        const newDeps = {};
                        jsonRows.forEach((r, idx) => {
                            if (r["日期"] && !String(r["日期"]).includes("簽收人")) {
                                newDeps[`dep_${idx}`] = { "日期": r["日期"], "入金金額": Number(r["入金金額"] || 0) };
                            }
                        });
                        set(ref(db, "deposits"), newDeps);
                        return;
                    }

                    const jsonRows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
                    const formattedRows = {};
                    jsonRows.forEach((r, idx) => {
                        if (r["品號"] && !String(r["品號"]).includes("簽收人")) {
                            const qty = Number(r["數量"] || 0);
                            const hours = Number(r["後處理工時(H)"] || 0);
                            const unitPrice = Math.floor(250 * hours);
                            const actualComp = Number(r["實際完成數"] || 0);
                            
                            formattedRows[`row_${idx}`] = {
                                "品號": r["品號"] || "", "貨號": r["貨號"] || "", "工單號碼": r["工單號碼"] || "",
                                "數量": qty, "後處理工時(H)": hours, "單價": unitPrice,
                                "作業人員": r["作業人員"] || "", "預計總價": qty * unitPrice,
                                "實際完成數": actualComp, "實際總價": unitPrice * actualComp,
                                "完成率": qty > 0 ? (actualComp / qty) : 0, "備註": r["備註"] || ""
                            };
                        }
                    });
                    allDataCache[sheetName] = formattedRows;
                });
                set(ref(db, "sheets"), allDataCache).then(() => {
                    alert("Excel 匯入並比對更新成功！");
                    renderApp();
                });
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
